{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учебное приложение{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-light bg-white border-bottom">
    <div class="container-xl">
        <a class="navbar-brand" href="{% url 'profile' %}">DjangoApp</a>

        {% if user.is_authenticated %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'profile' %}">Профиль</a>
                <a class="nav-link" href="{% url 'dashboard' %}">Дашборды</a>
                <a class="nav-link" href="{% url 'department_list' %}">Факультеты</a>
                <a class="nav-link" href="{% url 'academic_group_list' %}">Группы</a>
                <a class="nav-link" href="{% url 'courses_list' %}">Курсы</a>
            </div>

            <div class="d-flex align-items-center gap-3 mt-2 mt-md-0">
                <span>{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger btn-sm" type="submit">Выйти</button>
                </form>
            </div>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container-xl page-container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"></script>
</body>
</html>
